<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022"
                    numOctaves="3" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="3.5"
                    flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="600" fill="#FFFFFF"/>

  <text x="490" y="50" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="21" fill="#1A1A1A">Prompt cache lifecycle</text>

  <!-- transitions -->
  <g fill="none" stroke="#616161" stroke-width="2.2" stroke-linecap="round">
    <path d="M188,280 Q254,266 318,280" marker-end="url(#arrow)"/>
    <path d="M438,280 Q500,266 558,280" marker-end="url(#arrow)"/>
    <path d="M620,338 Q620,386 620,428" marker-end="url(#arrow)"/>
  </g>

  <!-- the cheap cycle: prefix stays byte-identical, cache is re-read -->
  <g fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round">
    <path d="M579,239 Q540,130 620,122 Q700,130 657,241" marker-end="url(#arrowMint)"/>
  </g>

  <!-- the expensive exit: prefix changed, cache is void -->
  <g fill="none" stroke="#AD1457" stroke-width="2.2" stroke-linecap="round"
     stroke-dasharray="9 6">
    <path d="M665,318 Q752,352 804,386" marker-end="url(#arrowRose)"/>
  </g>

  <text x="254" y="246" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="14" fill="#1A1A1A">first turn</text>
  <text x="499" y="244" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="14" fill="#1A1A1A">prefix stable</text>
  <text x="620" y="100" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="14" fill="#2E7D32">cheap re-read</text>
  <text x="792" y="316" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="14" fill="#AD1457">prefix mutates</text>
  <text x="672" y="384" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="14" fill="#1A1A1A">loop ends</text>

  <!-- cold -->
  <g transform="translate(130,280)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="58"
            fill="#FFF8E1" stroke="#E65100" stroke-width="2.4"
            filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">cold</text>
  </g>

  <!-- written -->
  <g transform="translate(380,280)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="58"
            fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4"
            filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">written</text>
  </g>

  <!-- hit -->
  <g transform="translate(620,280)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="58"
            fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.4"
            filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">hit</text>
  </g>

  <!-- missed: failure terminal, double stroked -->
  <g transform="translate(860,420)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="58"
            fill="#FCE4EC" stroke="#AD1457" stroke-width="2.4"
            filter="url(#sketch)"/>
    <circle cx="0" cy="0" r="49"
            fill="none" stroke="#AD1457" stroke-width="2"
            filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">missed</text>
  </g>

  <!-- done: happy terminal, double stroked -->
  <g transform="translate(620,490)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="58"
            fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.4"
            filter="url(#sketch)"/>
    <circle cx="0" cy="0" r="49"
            fill="none" stroke="#2E7D32" stroke-width="2"
            filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">done</text>
  </g>

  <!-- annotation leader -->
  <g fill="none" stroke="#E65100" stroke-width="1.4" stroke-linecap="round">
    <path d="M508,394 L575,326"/>
  </g>

  <!-- annotation -->
  <g transform="translate(430,400)" filter="url(#shadow)">
    <rect x="-75" y="-16" width="150" height="32" rx="16"
          fill="#FFF8E1" stroke="#E65100" stroke-width="1.8"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" fill="#1A1A1A">cache pays here</text>
  </g>
</svg>
