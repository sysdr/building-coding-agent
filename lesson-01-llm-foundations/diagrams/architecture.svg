<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022"
                    numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="3.5"
                    flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="620" fill="#FFFFFF"/>

  <text x="490" y="45" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="21" fill="#1A1A1A">apr tokens</text>

  <!-- trust boundary: the package's own code -->
  <g transform="translate(490,265)" filter="url(#shadow)">
    <rect x="-240" y="-155" width="480" height="310" rx="18"
          fill="none" stroke="#6A1B9A" stroke-width="2.2"
          stroke-dasharray="10 7" stroke-linejoin="round"/>
  </g>
  <text x="330" y="130" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="15" fill="#6A1B9A">apr package</text>

  <!-- connectors (under nodes) -->
  <g fill="none" stroke="#616161" stroke-width="2.2" stroke-linecap="round">
    <path d="M195,270 Q250,230 308,182" marker-end="url(#arrow)"/>
    <path d="M195,270 Q250,310 308,348" marker-end="url(#arrow)"/>
    <path d="M492,182 Q516,215 528,248" marker-end="url(#arrow)"/>
    <path d="M492,348 Q516,315 528,282" marker-end="url(#arrow)"/>
    <path d="M620,466 Q620,400 620,300" marker-end="url(#arrow)"/>
    <path d="M712,265 Q742,265 768,265" marker-end="url(#arrow)"/>
  </g>

  <!-- Payload (input) -->
  <g transform="translate(120,270)" filter="url(#shadow)">
    <rect x="-75" y="-32" width="150" height="64" rx="14"
          fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Payload</text>
  </g>

  <!-- Exact Count -->
  <g transform="translate(400,182)" filter="url(#shadow)">
    <rect x="-90" y="-32" width="180" height="64" rx="14"
          fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Exact Count</text>
  </g>

  <!-- Heuristic -->
  <g transform="translate(400,348)" filter="url(#shadow)">
    <rect x="-90" y="-32" width="180" height="64" rx="14"
          fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Heuristic</text>
  </g>

  <!-- Cost Model -->
  <g transform="translate(620,265)" filter="url(#shadow)">
    <rect x="-92" y="-32" width="184" height="64" rx="14"
          fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Cost Model</text>
  </g>

  <!-- Price Table (reader supplied, outside boundary) -->
  <g transform="translate(620,498)" filter="url(#shadow)">
    <rect x="-95" y="-32" width="190" height="64" rx="14"
          fill="#FFF8E1" stroke="#E65100" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Price Table</text>
  </g>

  <!-- Cost Report (output artifact, outside boundary) -->
  <g transform="translate(862,265)" filter="url(#shadow)">
    <rect x="-92" y="-32" width="184" height="64" rx="14"
          fill="#FFF8E1" stroke="#E65100" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Cost Report</text>
  </g>

  <!-- annotation leaders -->
  <g fill="none" stroke="#E65100" stroke-width="1.4" stroke-linecap="round">
    <path d="M400,106 L400,148"/>
    <path d="M776,498 L717,498"/>
  </g>

  <!-- annotation: ground truth -->
  <g transform="translate(400,90)" filter="url(#shadow)">
    <rect x="-63" y="-16" width="126" height="32" rx="16"
          fill="#FFF8E1" stroke="#E65100" stroke-width="1.8"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" fill="#1A1A1A">Ground truth</text>
  </g>

  <!-- annotation: reader supplies prices -->
  <g transform="translate(862,498)" filter="url(#shadow)">
    <rect x="-85" y="-16" width="170" height="32" rx="16"
          fill="#FFF8E1" stroke="#E65100" stroke-width="1.8"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" fill="#1A1A1A">You supply prices</text>
  </g>
</svg>
