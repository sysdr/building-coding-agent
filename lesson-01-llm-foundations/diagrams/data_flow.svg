<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022"
                    numOctaves="3" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="3.5"
                    flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="640" fill="#FFFFFF"/>

  <text x="550" y="60" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="21" fill="#1A1A1A">Text to dollars</text>

  <!-- main chain connectors -->
  <g fill="none" stroke="#616161" stroke-width="2.2" stroke-linecap="round">
    <path d="M195,200 Q224,200 248,200" marker-end="url(#arrow)"/>
    <path d="M430,200 Q462,200 488,200" marker-end="url(#arrow)"/>
    <path d="M650,200 Q671,200 688,200" marker-end="url(#arrow)"/>
    <path d="M850,200 Q884,200 913,200" marker-end="url(#arrow)"/>
  </g>

  <!-- heuristic bypass (failure-prone path) -->
  <g fill="none" stroke="#AD1457" stroke-width="2.2" stroke-linecap="round"
     stroke-dasharray="9 6">
    <path d="M110,255 Q110,345 248,396" marker-end="url(#arrowRose)"/>
    <path d="M430,400 Q722,388 914,248" marker-end="url(#arrowRose)"/>
  </g>

  <!-- Raw Text -->
  <g transform="translate(110,200)" filter="url(#shadow)">
    <rect x="-80" y="-50" width="160" height="100" rx="14"
          fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="-18" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Raw Text</text>
  </g>
  <g transform="translate(110,200)" filter="url(#shadow)">
    <rect x="-55" y="15" width="110" height="14" rx="4"
          fill="#2E7D32" stroke="#2E7D32" stroke-width="1.4"/>
  </g>

  <!-- Pretokens -->
  <g transform="translate(340,200)" filter="url(#shadow)">
    <rect x="-85" y="-50" width="170" height="100" rx="14"
          fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="-18" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Pretokens</text>
  </g>
  <g transform="translate(340,200)" filter="url(#shadow)">
    <rect x="-64" y="15" width="26" height="14" rx="3" fill="#1565C0"/>
    <rect x="-30" y="15" width="26" height="14" rx="3" fill="#1565C0"/>
    <rect x="4"   y="15" width="26" height="14" rx="3" fill="#1565C0"/>
    <rect x="38"  y="15" width="26" height="14" rx="3" fill="#1565C0"/>
  </g>

  <!-- Tokens -->
  <g transform="translate(570,200)" filter="url(#shadow)">
    <rect x="-75" y="-50" width="150" height="100" rx="14"
          fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="-18" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Tokens</text>
  </g>
  <g transform="translate(570,200)" filter="url(#shadow)">
    <rect x="-57" y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="-44" y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="-31" y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="-18" y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="-5"  y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="8"   y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="21"  y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="34"  y="15" width="10" height="14" rx="2" fill="#1565C0"/>
    <rect x="47"  y="15" width="10" height="14" rx="2" fill="#1565C0"/>
  </g>

  <!-- Priced -->
  <g transform="translate(770,200)" filter="url(#shadow)">
    <rect x="-75" y="-50" width="150" height="100" rx="14"
          fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="-18" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Priced</text>
  </g>
  <g transform="translate(770,200)" filter="url(#shadow)">
    <rect x="-57" y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="-44" y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="-31" y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="-18" y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="-5"  y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="8"   y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="21"  y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="34"  y="15" width="10" height="14" rx="2" fill="#E65100"/>
    <rect x="47"  y="15" width="10" height="14" rx="2" fill="#E65100"/>
  </g>

  <!-- Cost -->
  <g transform="translate(990,200)" filter="url(#shadow)">
    <rect x="-70" y="-50" width="140" height="100" rx="14"
          fill="#FFF8E1" stroke="#E65100" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="-18" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Cost</text>
  </g>
  <g transform="translate(990,200)" filter="url(#shadow)">
    <rect x="-35" y="15" width="70" height="14" rx="4" fill="#E65100"/>
  </g>

  <!-- Heuristic (bypass node) -->
  <g transform="translate(340,400)" filter="url(#shadow)">
    <rect x="-85" y="-50" width="170" height="100" rx="14"
          fill="#FCE4EC" stroke="#AD1457" stroke-width="2.4"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="-18" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="17" fill="#1A1A1A">Heuristic</text>
  </g>
  <g transform="translate(340,400)" filter="url(#shadow)">
    <rect x="-52" y="15" width="104" height="14" rx="4" fill="#AD1457"/>
  </g>

  <!-- leaders to error pills -->
  <g fill="none" stroke="#E65100" stroke-width="1.4" stroke-linecap="round">
    <path d="M340,455 L340,471"/>
    <path d="M340,509 L340,541"/>
  </g>

  <!-- measured error pills -->
  <g transform="translate(340,490)" filter="url(#shadow)">
    <rect x="-120" y="-17" width="240" height="34" rx="17"
          fill="#FFF8E1" stroke="#E65100" stroke-width="1.8"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" fill="#1A1A1A">-34.7% on terminal output</text>
  </g>

  <g transform="translate(340,560)" filter="url(#shadow)">
    <rect x="-105" y="-17" width="210" height="34" rx="17"
          fill="#FFF8E1" stroke="#E65100" stroke-width="1.8"
          stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="13" fill="#1A1A1A">+18.3% on a traceback</text>
  </g>
</svg>
