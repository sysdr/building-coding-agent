<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="3.5" flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="320" fill="#FFFFFF"/>

  <g transform="translate(140,60)" filter="url(#shadow)">
    <rect x="-100" y="-30" width="200" height="60" rx="14" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.4" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#1A1A1A">Pinned agent</text>
  </g>

  <g transform="translate(140,160)" filter="url(#shadow)">
    <rect x="-90" y="-28" width="180" height="56" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#1A1A1A">bash tool</text>
  </g>

  <path d="M140,90 Q140,125 140,132" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(430,60)" filter="url(#shadow)">
    <rect x="-110" y="-30" width="220" height="60" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.4" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#1A1A1A">Instance A</text>
  </g>
  <g transform="translate(430,60)">
    <text x="0" y="45" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">produces a diff — resolves</text>
  </g>

  <g transform="translate(430,190)" filter="url(#shadow)">
    <rect x="-110" y="-30" width="220" height="60" rx="14" fill="#FCE4EC" stroke="#AD1457" stroke-width="2.4" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#1A1A1A">Instance B</text>
  </g>
  <g transform="translate(430,190)">
    <text x="0" y="45" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">produces a diff — of unknown correctness</text>
  </g>

  <path d="M230,150 Q330,90 320,60" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
  <path d="M230,170 Q330,195 320,190" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(430,270)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#FFF8E1" stroke="#E65100" stroke-width="1.6"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">no instrument yet to tell them apart</text>
  </g>
</svg>
