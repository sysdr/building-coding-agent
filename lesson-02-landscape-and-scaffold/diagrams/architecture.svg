<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="3.5" flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="220" fill="#FFFFFF"/>

  <!-- spine -->
  <line x1="48" y1="110" x2="650" y2="110" stroke="#616161" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- annotation: you are here -->
  <g transform="translate(48,38)" filter="url(#shadow)">
    <rect x="-46" y="-15" width="92" height="30" rx="15" fill="#FFF8E1" stroke="#E65100" stroke-width="2" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">you are here</text>
  </g>
  <line x1="48" y1="53" x2="48" y2="80" stroke="#E65100" stroke-width="1.6" stroke-dasharray="3,3"/>

  <!-- phase 0: active, sky, larger emphasis via double ring -->
  <g transform="translate(48,110)" filter="url(#shadow)">
    <circle r="28" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.6" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#1A1A1A">0</text>
  </g>
  <text x="48" y="172" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">Scaffold</text>

  <!-- phases 1-7: not yet built, muted -->
  <g transform="translate(134,110)" filter="url(#shadow)">
    <circle r="26" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="2" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#616161">1</text>
  </g>
  <text x="134" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#616161">Baseline</text>

  <g transform="translate(220,110)" filter="url(#shadow)">
    <circle r="26" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="2" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#616161">2</text>
  </g>
  <text x="220" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#616161">Tools</text>

  <g transform="translate(306,110)" filter="url(#shadow)">
    <circle r="26" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="2" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#616161">3</text>
  </g>
  <text x="306" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#616161">Sandbox</text>

  <g transform="translate(392,110)" filter="url(#shadow)">
    <circle r="26" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="2" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#616161">4</text>
  </g>
  <text x="392" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#616161">Control</text>

  <g transform="translate(478,110)" filter="url(#shadow)">
    <circle r="26" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="2" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#616161">5</text>
  </g>
  <text x="478" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#616161">Swarm</text>

  <g transform="translate(564,110)" filter="url(#shadow)">
    <circle r="26" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="2" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#616161">6</text>
  </g>
  <text x="564" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#616161">Scale</text>

  <g transform="translate(650,110)" filter="url(#shadow)">
    <circle r="26" fill="#EEEEEE" stroke="#9E9E9E" stroke-width="2" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#616161">7</text>
  </g>
  <text x="650" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#616161">Ship</text>
</svg>
