<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="3.5" flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AD1457"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="#FFFFFF"/>

  <!-- transitions -->
  <path d="M150,160 L280,160" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
  <text x="215" y="146" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">valid</text>

  <path d="M120,208 Q180,270 285,290" stroke="#AD1457" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <text x="175" y="255" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#AD1457">invalid</text>

  <path d="M368,127 Q470,60 535,90" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
  <text x="450" y="82" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">confirms</text>

  <path d="M368,193 Q470,260 535,235" stroke="#AD1457" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <text x="450" y="268" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#AD1457">falsifies</text>

  <!-- Drafted (non-terminal) -->
  <g transform="translate(100,160)" filter="url(#shadow)">
    <circle r="50" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#1A1A1A">Drafted</text>
  </g>

  <!-- Recorded (non-terminal) -->
  <g transform="translate(330,160)" filter="url(#shadow)">
    <circle r="50" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.4" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#1A1A1A">Recorded</text>
  </g>

  <!-- Rejected (terminal, double ring) -->
  <g transform="translate(330,315)" filter="url(#shadow)">
    <circle r="50" fill="#FCE4EC" stroke="#AD1457" stroke-width="2.4" filter="url(#sketch)"/>
    <circle r="42" fill="none" stroke="#AD1457" stroke-width="1.6"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#1A1A1A">Rejected</text>
  </g>

  <!-- Confirmed (terminal, double ring) -->
  <g transform="translate(580,75)" filter="url(#shadow)">
    <circle r="50" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.4" filter="url(#sketch)"/>
    <circle r="42" fill="none" stroke="#2E7D32" stroke-width="1.6"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1A1A1A">Confirmed</text>
  </g>

  <!-- Falsified (terminal, double ring) -->
  <g transform="translate(580,250)" filter="url(#shadow)">
    <circle r="50" fill="#FCE4EC" stroke="#AD1457" stroke-width="2.4" filter="url(#sketch)"/>
    <circle r="42" fill="none" stroke="#AD1457" stroke-width="1.6"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1A1A1A">Falsified</text>
  </g>

  <!-- annotation: when the fork happens -->
  <g transform="translate(460,160)" filter="url(#shadow)">
    <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#FFF8E1" stroke="#E65100" stroke-width="1.8" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#1A1A1A">at Gate 5</text>
  </g>
</svg>
