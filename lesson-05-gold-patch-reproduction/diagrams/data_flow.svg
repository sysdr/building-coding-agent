<svg viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="3.5" flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="320" fill="#FFFFFF"/>

  <!-- connectors -->
  <path d="M160,160 Q193,145 226,160" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
  <path d="M456,160 Q489,145 522,160" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
  <path d="M672,160 Q705,145 738,160" stroke="#616161" stroke-width="2.2" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>

  <!-- node 1: idea -->
  <g transform="translate(40,120)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="80" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.2" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="60" y="40" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#1A1A1A">Idea</text>
  </g>

  <!-- node 2: claim record, with two field rows showing structure -->
  <g transform="translate(226,80)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="160" rx="16" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.2" stroke-linejoin="round" filter="url(#sketch)"/>
  </g>
  <text x="341" y="107" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#1A1A1A">Claim</text>
  <g transform="translate(266,125)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.6"/>
    <text x="75" y="15" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">statement</text>
  </g>
  <g transform="translate(246,165)">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.6"/>
    <text x="95" y="15" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">would_disprove</text>
  </g>

  <!-- node 3: claims.json, drawn as a stack to suggest a file of records -->
  <g transform="translate(534,122)">
    <rect x="0" y="0" width="150" height="100" rx="12" fill="#FFF8E1" stroke="#E65100" stroke-width="1.4" opacity="0.45" filter="url(#sketch)"/>
  </g>
  <g transform="translate(528,116)">
    <rect x="0" y="0" width="150" height="100" rx="12" fill="#FFF8E1" stroke="#E65100" stroke-width="1.6" opacity="0.7" filter="url(#sketch)"/>
  </g>
  <g transform="translate(522,110)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="100" rx="12" fill="#FFF8E1" stroke="#E65100" stroke-width="2.2" stroke-linejoin="round" filter="url(#sketch)"/>
  </g>
  <text x="597" y="150" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#1A1A1A">claims.json</text>
  <text x="597" y="175" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">record list</text>

  <!-- node 4: gate check -->
  <g transform="translate(738,120)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="80" rx="16" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.2" stroke-linejoin="round" filter="url(#sketch)"/>
    <text x="70" y="34" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#1A1A1A">Gate check</text>
    <text x="70" y="56" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1A1A1A">reads later</text>
  </g>
</svg>
